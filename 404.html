<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página perdida — Kailkob</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0a0a0a; --chalk: #efe8d8; --lime: #c8f03c; --lilac: #b99ae6; --muted: #a39d90; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem 1rem; background: var(--ink); color: var(--chalk); font: 1.2rem/1.5 "Shadows Into Light Two", cursive; letter-spacing: .04em; text-align: center; }
    .box { border: 1.6px solid #efe8d8cc; border-radius: 14px; padding: clamp(2rem, 6vw, 3.5rem) clamp(1.25rem, 6vw, 4rem); max-width: 34rem; }
    h1 { margin: 0 0 .5rem; font: 400 clamp(3.5rem, 14vw, 6rem)/1 "UnifrakturMaguntia", serif; color: var(--lilac); }
    img { width: 10rem; margin: 1rem auto; display: block; mix-blend-mode: screen; }
    p { margin: 0 0 1.5rem; }
    a { color: var(--chalk); text-decoration: none; border-bottom: 2px solid var(--lime); touch-action: manipulation; }
    a:focus-visible { outline: 2px dashed var(--lime); outline-offset: 4px; }
    @media (hover: hover) and (pointer: fine) { a:hover { color: var(--lime); } }
  </style>
</head>
<body>
  <main class="box">
    <h1>404</h1>
    <img src="/img/rata-cascos.jpg" alt="" width="100" height="75">
    <p>esta página se ha perdido entre la hierba.</p>
    <a href="/">volver al mapa →</a>
  </main>
</body>
</html>
